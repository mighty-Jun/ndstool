name: Build Cross-Platform ndstool Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write 

    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            bin_name: ndstool.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compile ndstool
      run: make

    - name: Set Execution Permission (Linux/macOS)
      if: runner.os != 'Windows'
      run: chmod +x ndstool


    - name: Rename binary for release
      run: mv ${{ matrix.bin_name }} ndstool-${{ matrix.os_name }}${{ runner.os == 'Windows' && '.exe' || '' }}
      shell: bash

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ndstool*